name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for CI (read-only).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: |
          if bun run --help 2>&1 | grep -q '"check"'; then
            bun run check
          else
            bunx tsc --noEmit
          fi

      - name: Build (tsup)
        # --if-present so CI stays green before tsup is wired up.
        # Once each package has a `build` script (e.g. "tsup"), this becomes a hard check.
        run: bun run build --if-present
