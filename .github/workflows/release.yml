name: Release

on:
  push:
    branches: [main]

# Required for changesets/action to push Version Packages PR / tags
# and for npm Trusted Publishing (OIDC) provenance.
permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

# Only one Release run at a time — publishing is not safe to parallelize.
# Do NOT cancel in-progress (would leave a half-published release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets / publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Re-declare permissions at job level (explicit, required by changesets/action docs
    # and makes branch-protection / OIDC auditing clearer).
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets/action needs full history + to push back to main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # changesets publish shells out to `npm publish` under the hood, and
      # `npm publish --provenance` / OIDC attestation only works via npm CLI.
      # We need Node + npm alongside Bun even though install/build uses Bun.
      - name: Setup Node for npm publish + OIDC
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Optional but recommended: verify the release artefact builds.
      # If no `build` script exists yet this is a no-op due to --if-present.
      - name: Build packages
        run: bun run build --if-present

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # `version` bumps packages + CHANGELOG and opens/updates the "Version Packages" PR.
          # `publish` runs only when a publish commit (version bump) lands on main.
          version: bunx changeset version
          publish: bunx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enables `npm publish --provenance` inside `changeset publish` via npm config.
          # Alternative is `publishConfig.provenance` in each package.json (see docs below).
          NPM_CONFIG_PROVENANCE: "true"
          # No NPM_TOKEN — OIDC Trusted Publishing exchanges the GitHub id-token
          # for a short-lived npm token automatically (requires Trusted Publisher configured on npmjs.com).
